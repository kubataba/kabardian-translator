<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabardian Translator</title>
<script>try{const th=localStorage.getItem("theme");if(th)document.documentElement.dataset.theme=th}catch(e){}</script>
<style>
/* light: warm paper, never pure white; dark: the original palette. data-theme (☀/☾ in the header) overrides the system */
:root{color-scheme:light;--bg:#ebe6db;--card:#f5f1e8;--fg:#2d2a24;--muted:#736c60;--line:#d6cebe;--accent:#2f6f5e;
  --accent-fg:#f5f1e8;--soft:#dde5da;--warn:#865c00;--warnbg:#f3e7c8;--err:#9e3128;--errbg:#f3ddd8;
  --shadow:0 1px 3px rgba(70,55,30,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#141513;--card:#1d1e1b;--fg:#e9e7e0;--muted:#9c9a92;
  --line:#33342f;--accent:#7fc4ae;--accent-fg:#10201b;--soft:#1f2c27;--warn:#e2bd5c;--warnbg:#2b2617;--err:#f09b92;--errbg:#3a1f1c}}
:root[data-theme=dark]{color-scheme:dark;--bg:#141513;--card:#1d1e1b;--fg:#e9e7e0;--muted:#9c9a92;--line:#33342f;--accent:#7fc4ae;--accent-fg:#10201b;
  --soft:#1f2c27;--warn:#e2bd5c;--warnbg:#2b2617;--err:#f09b92;--errbg:#3a1f1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card)}
.brand{font-weight:700;font-size:17px;margin-right:auto}.brand small{font-weight:500;color:var(--muted);margin-left:6px}
nav button,.seg button{border:0;background:none;color:var(--muted);font:inherit;padding:6px 10px;border-radius:8px;cursor:pointer}
nav button.on{color:var(--fg);background:var(--soft);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
main{max-width:1180px;margin:0 auto;padding:20px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
select,input[type=range]{font:inherit;color:var(--fg)}
select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:190px}
.swap{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;width:38px;height:36px;cursor:pointer;font-size:17px}
.panes{display:grid;grid-template-columns:1fr 1fr}
.pane{display:flex;flex-direction:column;min-height:380px}
.pane+.pane{border-left:1px solid var(--line)}
textarea,.out{flex:1;width:100%;border:0;resize:vertical;background:transparent;color:var(--fg);font:16px/1.6 inherit;font-family:inherit;padding:14px 16px;min-height:300px;outline:none}
.out{white-space:pre-wrap;overflow:auto;max-height:70vh}
.out.empty{color:var(--muted)}
.out .s{cursor:pointer;border-radius:4px;transition:background .15s}
.out .s:hover{background:var(--soft)}
.out .s.hl{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.out .w.hl{background:var(--accent);color:var(--accent-fg);border-radius:3px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.menuwrap{position:relative}
#engine .seg button{font-size:13px;padding:4px 10px}#engine .seg button:disabled{opacity:.5;cursor:default}
#engine .fixed{font-size:13px;color:var(--muted)}
.menu{display:none;position:absolute;right:0;bottom:calc(100% + 6px);z-index:20;min-width:300px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 8px 28px rgba(0,0,0,.18)}
.menu.on{display:block}
.mrow{display:flex;align-items:center;gap:6px;padding:6px 6px;font-size:14px}
.mrow+.mrow{border-top:1px solid var(--line)}
.muted{color:var(--muted)}.small{font-size:13px}.grow{flex:1}
.progress{height:4px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.drop{margin-top:14px;padding:16px;border:1.5px dashed var(--line);border-radius:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.drop.over{border-color:var(--accent);background:var(--soft)}
.note{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:14px;display:none}
.note.err{background:var(--errbg);color:var(--err)}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
tr.grp td{background:var(--soft);font-weight:700}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--soft);font-size:12px;white-space:nowrap}
.q{font-variant-numeric:tabular-nums}
.q.lo{color:var(--err)}.q.mid{color:var(--warn)}.q.hi{color:var(--accent)}
.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.models .card{padding:16px}
.models h3{margin:0 0 4px;font-size:16px}
.log{font:12px ui-monospace,Menlo,monospace;color:var(--muted);max-height:90px;overflow:auto;margin-top:8px;white-space:pre-wrap}
.about{padding:20px 24px;max-width:860px}.about h2{margin-top:0}.about h3{margin:22px 0 6px;font-size:16px}
@media (max-width:820px){.panes{grid-template-columns:1fr}.pane+.pane{border-left:0;border-top:1px solid var(--line)}
  .bar select{min-width:0;flex:1 1 38%}.bar .grow{display:none}#route{flex-basis:100%}#engine{flex-basis:100%}main{padding:12px}header{padding:10px 12px}}
</style>
</head>
<body>
<header>
  <div class="brand">Kabardian Translator <small>v{{ version }}</small></div>
  <nav>
    <button data-tab="translate" class="on" data-i="tab_translate"></button>
    <button data-tab="languages" data-i="tab_languages"></button>
    <button data-tab="models" data-i="tab_models"></button>
    <button data-tab="about" data-i="tab_about"></button>
  </nav>
  <div class="seg" id="theme"><button data-th="light">☀</button><button data-th="dark">☾</button></div>
  <div class="seg" id="ui"><button data-ui="ru">RU</button><button data-ui="en">EN</button><button data-ui="lv">LV</button></div>
</header>
<main>

<section id="translate" class="on">
  <div class="card">
    <div class="bar">
      <select id="src"></select>
      <button class="swap" id="swap" title="⇄">⇄</button>
      <select id="tgt"></select>
      <span class="grow"></span>
      <span class="small muted" id="route"></span>
      <span id="engine"></span>
    </div>
    <div class="progress"><i id="prog"></i></div>
    <div class="panes">
      <div class="pane">
        <textarea id="text" spellcheck="false"></textarea>
        <div class="tools">
          <button class="btn primary" id="go" data-i="translate"></button>
          <button class="btn" id="speak-src" data-i="listen"></button>
          <button class="btn" id="clear" data-i="clear"></button>
          <span class="grow"></span>
          <span class="small muted" id="count"></span>
        </div>
      </div>
      <div class="pane">
        <div class="out empty" id="out"></div>
        <div class="tools">
          <button class="btn" id="speak-tgt" data-i="listen"></button>
          <select id="voice" style="min-width:150px"></select>
          <button class="btn" id="copy" data-i="copy"></button>
          <span class="grow"></span>
          <span class="menuwrap">
            <button class="btn" id="save" data-i="save" disabled></button>
            <div class="menu" id="savemenu">
              <div class="mrow"><span data-i="save_trans"></span><span class="grow"></span>
                <button class="btn" data-mode="translation" data-fmt="txt">.txt</button><button class="btn" data-mode="translation" data-fmt="docx">.docx</button></div>
              <div class="mrow"><span data-i="save_both"></span><span class="grow"></span>
                <button class="btn" data-mode="bilingual" data-fmt="txt">.txt</button><button class="btn" data-mode="bilingual" data-fmt="docx">.docx</button></div>
            </div>
          </span>
        </div>
      </div>
    </div>
    <div class="tools small">
      <span id="status" class="muted"></span>
      <span class="grow"></span>
      <label class="chk"><input type="checkbox" id="fast"><span data-i="fast"></span></label>
      <label class="chk"><span data-i="speed"></span> <input type="range" id="rate" min="0.7" max="1.4" step="0.1" value="1"></label>
    </div>
  </div>

  <div class="drop" id="drop">
    <strong data-i="doc_title"></strong>
    <span class="muted small" data-i="doc_hint"></span>
    <span class="grow"></span>
    <input type="file" id="file" accept=".txt,.md,.docx" hidden>
    <button class="btn" id="pick" data-i="doc_pick"></button>
  </div>
  <div class="note" id="note"></div>
</section>

<section id="languages">
  <div class="card" style="overflow-x:auto">
    <div class="bar"><span data-i="lang_intro" class="small"></span></div>
    <table id="langtable"><thead><tr>
      <th data-i="col_lang"></th><th data-i="col_script"></th><th data-i="col_route"></th>
      <th data-i="col_quality"></th><th data-i="col_voice"></th></tr></thead><tbody></tbody></table>
  </div>
</section>

<section id="models">
  <p class="small muted" data-i="models_intro"></p>
  <div class="models" id="modelcards"></div>
</section>

<section id="about">
  <div class="card about" id="abouttext"></div>
</section>
</main>

  clearInterval(timer);

    if (j.state === "error") { clearInterval(timer); $("#go").disabled = false; $("#status").textContent = ""; note(j.error.includes("not installed") ? t("nomodel") : j.error, true); }
  }, 700);

// ---- reading aloud: the original (no highlighting — it is a text field) or the translation (sentence and word
// highlighting). The text is read in units of a paragraph, long paragraphs cut at sentence ends, so the first sound
// comes quickly; the next unit is prepared while the current one plays. ▶ turns into ■ and stops at once.
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const UNIT = 320;   // characters: about 20–25 s of speech
let P = null;   // {kind, paras, idx, audio, data: {}, raf, lang, voice, speed}
function stopReading(){
  if (!P) return;
  P.abort.abort();
  if (P.audio) { P.audio.pause(); P.audio.src = ""; }
  cancelAnimationFrame(P.raf); P = null;
  document.querySelectorAll("#out .hl").forEach(e => e.classList.remove("hl"));
  $("#speak-tgt").textContent = t("listen"); $("#speak-src").textContent = t("listen");
}
function paragraphs(text){
  const out = []; const re = /[^\n]+/g; let m;
  while ((m = re.exec(text))) {
    if (!m[0].trim()) continue;
    const line = m[0], base = m.index, ends = [];
    const se = /[.!?…]+["»”')\]]*\s+/g; let k;
    while ((k = se.exec(line))) ends.push(k.index + k[0].length);
    let start = 0, last = 0;
    const push = (a, b) => { const body = line.slice(a, b).replace(/\s+$/, ""); if (body.trim()) out.push({start: base + a, end: base + a + body.length, text: body}); };
    for (const e of ends) { if (e - start > UNIT && last > start) { push(start, last); start = last; } last = e; }
    push(start, line.length);
  }
  return out;
}
function renderOut(paras, text){
  const o = $("#out"); o.innerHTML = ""; o.classList.remove("empty"); let pos = 0;
  paras.forEach((p, i) => {
    if (p.start > pos) o.append(document.createTextNode(text.slice(pos, p.start)));
    const span = document.createElement("span"); span.className = "p"; span.dataset.p = i; span.textContent = p.text;
    o.append(span); pos = p.end;
  });
  if (pos < text.length) o.append(document.createTextNode(text.slice(pos)));
}
function renderParagraph(i){
  const p = P.paras[i], d = P.data[i]; if (!d || d.rendered) return;
  const span = $(`#out .p[data-p="${i}"]`); let html = "", pos = 0;
  d.sentences.forEach((s, si) => {
    if (s.start > pos) html += esc(p.text.slice(pos, s.start));
    let inner = "", q = s.start;
    d.words.forEach((w, wi) => { if (w.start >= s.start && w.end <= s.end) {
      inner += esc(p.text.slice(q, w.start)) + `<span class="w" data-w="${wi}">${esc(p.text.slice(w.start, w.end))}</span>`; q = w.end; } });
    inner += esc(p.text.slice(q, s.end));
    html += `<span class="s" data-s="${si}">${inner}</span>`; pos = s.end;
  });
  html += esc(p.text.slice(pos)); span.innerHTML = html; d.rendered = true;
  const paras = P.paras;
  // a click on a sentence plays the translation from there — whatever was playing (the original too) stops
  span.querySelectorAll(".s").forEach(e => e.onclick = () => {
    const at = d.sentences[+e.dataset.s].t0;
    if (P && P.kind === "tgt" && P.paras === paras) playFrom(i, at); else startReading("tgt", i, at);
  });
}
function fetchParagraph(i){
  if (!P || i >= P.paras.length || P.data[i]) return P && P.data[i] && P.data[i].ready;
  const rec = P.data[i] = {};
  rec.ready = fetch("/api/speak_marked", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({text: P.paras[i].text, lang: P.lang, voice: P.voice, speed: P.speed}), signal: P.abort.signal})
    .then(r => r.json()).then(j => { if (j.error) throw new Error(j.error); Object.assign(rec, j); return rec; });
  rec.ready.catch(() => {});   // a stopped reading aborts its requests
  return rec.ready;
}
async function playFrom(i, at = 0){
  if (!P) return;
  if (i >= P.paras.length) return stopReading();
  P.idx = i; const mine = P;
  let d;
  try { d = await fetchParagraph(i); } catch (e) { if (P === mine) { note(e.message, true); stopReading(); } return; }
  if (P !== mine || P.idx !== i) return;
  const tgt = P.kind === "tgt";
  if (tgt) renderParagraph(i);
  fetchParagraph(i + 1);
  if (P.audio) { P.audio.pause(); }
  const a = P.audio = new Audio(d.audio); a.currentTime = at;
  a.onended = () => { if (P && P.audio === a) playFrom(i + 1); };
  a.play();
  if (!tgt) return;
  const span = $(`#out .p[data-p="${i}"]`);
  const tick = () => {
    if (!P || P.audio !== a) return;
    const now = a.currentTime;
    span.querySelectorAll(".s").forEach(e => { const s = d.sentences[+e.dataset.s];
      const on = now >= s.t0 && now < s.t1 + 0.18; if (on !== e.classList.contains("hl")) { e.classList.toggle("hl", on);
        if (on) e.scrollIntoView({block: "nearest", behavior: "smooth"}); } });
    span.querySelectorAll(".w").forEach(e => { const w = d.words[+e.dataset.w];
      e.classList.toggle("hl", now >= w.t0 && now < w.t1); });
    document.querySelectorAll(`#out .p:not([data-p="${i}"]) .hl`).forEach(e => e.classList.remove("hl"));
    P.raf = requestAnimationFrame(tick);
  };
  cancelAnimationFrame(P.raf); P.raf = requestAnimationFrame(tick);
}
function startReading(kind, from = null, at = 0){
  const was = P && P.kind;
  stopReading();                                  // only one reading at a time: a new one stops the previous
  if (was === kind && from === null) return;      // the same button again = stop
  const text = kind === "tgt" ? lastResult : $("#text").value;
  if (!text.trim()) return;
  const paras = paragraphs(text);
  P = {kind, paras, idx: 0, data: {}, abort: new AbortController(), speed: +$("#rate").value,
       lang: kind === "tgt" ? $("#tgt").value : $("#src").value, voice: kind === "tgt" ? $("#voice").value : null};
  if (kind === "tgt") renderOut(paras, lastResult);
  $(kind === "tgt" ? "#speak-tgt" : "#speak-src").textContent = t("stop");
  playFrom(from || 0, at);
}
$("#speak-tgt").onclick = () => startReading("tgt");
$("#speak-src").onclick = () => startReading("src");
$("#text").addEventListener("input", () => { if (P && P.kind === "src") stopReading(); });

  const box = $("#modelcards"); box.innerHTML = "";
  let running = false;

    const div = document.createElement("div"); div.className = "card";
    div.innerHTML = `<h3>${m.title}</h3><div class="small muted">${m.size_mb.toLocaleString(ui)} MB · ${m.licence}</div>
      <p><span class="pill">${state}</span></p>
      ${m.installed ? "" : `<button class="btn primary" ${inst.state==="running"?"disabled":""}>${t("install")}</button>`}
      ${inst.log ? `<div class="log">${inst.log.slice(-4).join("\n")}${inst.error?"\n"+inst.error:""}</div>` : ""}`;
    const b = div.querySelector("button");
    if (b) b.onclick = async () => { await fetch(`/api/models/${k}/install`, {method:"POST"}); loadModels(); };
    box.append(div);
  }
  if (running) setTimeout(loadModels, 1500);
}

applyUI();
const tab = store.get("tab", "translate"); const tb = document.querySelector(`nav button[data-tab=${tab}]`); if (tb) tb.click();
</script>
</body>
</html>
